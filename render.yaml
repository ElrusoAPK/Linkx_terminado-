services:
  - type: web
    name: linkx-asistencia
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linkx-asistencia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Administrador LINK X
      - key: ADMIN_EMAIL
        value: admin@linkx.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "*"
databases:
  - name: linkx-asistencia-db
    plan: free
    databaseName: linkx_asistencia
    user: linkx_user
